[workspace]
members = ["tbc-engine", "tbc-server", "tbc-gateway"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_pcg = "0.3"
blake3 = "1"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
