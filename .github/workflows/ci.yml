name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build tbc-engine (release)
        run: cargo build -p tbc-engine --release

      - name: Test tbc-engine
        run: cargo test -p tbc-engine

      - name: Verify crate packaging (dry-run)
        run: cargo publish -p tbc-engine --dry-run

      - name: Clippy (engine, warnings allowed)
        run: cargo clippy -p tbc-engine --all-targets
