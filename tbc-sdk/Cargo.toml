[package]
name = "tbc-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tbc-sdk"
readme.workspace = true
keywords = ["game-engine", "mmorpg", "sdk", "client"]
categories.workspace = true
description = "Typed HTTP/WebSocket client for The Big Computer engine"

[dependencies]
tbc-engine = { version = "0.1.0", path = "../tbc-engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "http_demo"
path = "examples/http_demo.rs"
