# TBC Engine — example deployment stack (M12)
# Usage: cp env.example .env && docker compose up --build

services:
  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  tbc-cluster:
    build: ..
    command: tbc-server
    environment:
      TBC_ARCHIVE_PATH: /data/tbc-archive.db
      TBC_NATS_URL: ${TBC_NATS_URL:-nats://nats:4222}
      TBC_NATS_STREAM: ${TBC_NATS_STREAM:-TBC_RWW}
    volumes:
      - tbc-data:/data
    ports:
      - "6014:6014"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6014/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  tbc-gateway:
    build: ..
    command: tbc-gateway
    environment:
      TBC_ARCHIVE_PATH: /data/tbc-archive.db
      TBC_NATS_URL: ${TBC_NATS_URL:-nats://nats:4222}
      TBC_QUIC_PORT: "4433"
      TBC_HEALTH_PORT: "9443"
      TBC_TLS_CERT: ${TBC_TLS_CERT:-/tls/cert.pem}
      TBC_TLS_KEY: ${TBC_TLS_KEY:-/tls/key.pem}
    volumes:
      - tbc-data:/data
      - ./tls:/tls:ro
    ports:
      - "4433:4433"
      - "9443:9443"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9443/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  tbc-shard-00:
    build: ..
    command: tbc-server
    environment:
      TBC_SHARD_ID: "0"
      TBC_PORT: "6020"
      TBC_ARCHIVE_PATH: /data/tbc-archive.db
      TBC_NATS_URL: ${TBC_NATS_URL:-nats://nats:4222}
    volumes:
      - tbc-data:/data
    ports:
      - "6020:6020"
    profiles: ["shards"]
    depends_on:
      nats:
        condition: service_healthy

  tbc-shard-01:
    build: ..
    command: tbc-server
    environment:
      TBC_SHARD_ID: "1"
      TBC_PORT: "6021"
      TBC_ARCHIVE_PATH: /data/tbc-archive.db
      TBC_NATS_URL: ${TBC_NATS_URL:-nats://nats:4222}
    volumes:
      - tbc-data:/data
    ports:
      - "6021:6021"
    profiles: ["shards"]
    depends_on:
      nats:
        condition: service_healthy

volumes:
  tbc-data:
